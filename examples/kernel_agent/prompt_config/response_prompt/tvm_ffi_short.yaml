method: system
prompt: null

per_turn_prompts:
  - name: first_turn
    condition: "current_turn == 0"
    history_mode: all
    skip_env: 0.0
    response_truncation: python_code, answer_code
    template: null
  - name: tool_response
    condition: "make_up_tool_response == True"
    history_mode: all
    skip_env: 0.0
    response_truncation: python_code, answer_code
    update_memory: false
    template: |
      Use this feedback to revise your previous CUDA + TVM-FFI implementation:

      {feedback}

      Return a full improved implementation with `CUDA_KERNELS`, `APPLY_BINDINGS` (TVM-FFI, no pybind), and `MODEL_NEW` (using `tvm_ffi_extension`).
